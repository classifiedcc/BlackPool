# BlackPool — HTTPS reverse proxy to blackpool HTTP (--http-port 8080)
#
# Prereqs on the pool server (Ubuntu):
#   1. DNS: A record  blackpool.classifiedbtc.com  ->  this server’s public IP
#   2. UFW: allow 80 and 443 (and 42069 for stratum if not already)
#        sudo ufw allow 'Nginx Full'
#   3. nginx + certbot:
#        sudo apt update && sudo apt install -y nginx certbot python3-certbot-nginx
#
# Install:
#   sudo cp bin/blackpool.nginx.site.conf /etc/nginx/sites-available/blackpool
#   sudo ln -sf /etc/nginx/sites-available/blackpool /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d blackpool.classifiedbtc.com
#
# Certbot will add SSL listen blocks; keep the proxy_* and location /ws/ below.
# After HTTPS works, verify:
#   curl -sS https://blackpool.classifiedbtc.com/api/pool/status | head -c 200
#   curl -sI -H "Origin: https://classifiedbtc.com" https://blackpool.classifiedbtc.com/api/pool/status

server {
    listen 80;
    listen [::]:80;
    server_name blackpool.classifiedbtc.com;

    location /ws/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
